<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Theme Buttons -->
        <div class="theme-buttons">
            <button onclick="setLight()" class="theme-btn">Light</button>
            <button onclick="setDark()" class="theme-btn">Dark</button>
        </div>

        <!-- Profile Card -->
        <div class="card">

            <div class="card-top">
                <img src="dark.jpg.jpg" alt="Dark Profile" class="profile-img dark-img">
                <img src="light.jpg.jpg" alt="Light Profile" class="profile-img light-img">

                <h1>PARMAR KHUSHAL</h1>

                <p class="bio">
                    Frontend student learning HTML, CSS, and JavaScript.
                    Currently practicing <a href="#">web development</a>.
                </p>

                <a href="mailto:parmarkhushal999@gmail.com" class="contact-btn">
                    <img src="icons/email.svg" alt="Email" class="icon">
                    Get in touch
                </a>
            </div>

            <!-- Social Media Links -->
            <div class="card-bottom">
                <a href="https://www.tiktok.com/" class="social-btn">
                    <img src="icons/tiktok.svg" alt="TikTok" class="icon">
                </a>
                <a href="https://www.instagram.com/mastikhor_khush" class="social-btn">
                    <img src="icons/instagram.svg" alt="Instagram" class="icon">
                </a>
                <a href="https://x.com/KhushalPar90693" class="social-btn">
                    <img src="icons/twitter.svg" alt="Twitter" class="icon">
                </a>
                <a href="https://github.com/Khushal1119" class="social-btn">
                    <img src="icons/website.svg" alt="Website" class="icon">
                </a>
            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
